---
layout: default
post_class: post-template page-template
---

{% if page.slug == 'signup' %}
    <nav class="main-nav clearfix">
        <a class="back-button icon-arrow-left" href="{{ site.baseurl }}">Blog</a>
    </nav>
{% else %}
    <nav class="main-nav clearfix">
        <a class="back-button icon-arrow-left" href="{{ site.baseurl }}">Home</a>
    </nav>
{%endif%}

<main class="content" role="main">
    <article class="post">
        {% if page.image %}
        <div {% if page.image_class %} class="{{page.image_class}}" {% endif %} >
        <div>
        <img 
            {% if page.image_class %} class="{{page.image_class}}" {% endif %} 
            src="{{page.image}}" 
            alt="" 
        />
        </div>
        </div>
        {% endif %}
        

        <h1 class="post-title">{{ page.title }}</h1>

        <section class="post-content">
            {{content}}
        </section>

    </article>

</main>
